<!doctype html><html lang="en"><head><meta name="robots" content="noindex"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LittleOwlsHut Patterns · crochet and knitting patterns</title><meta name="description" content="Crochet and knitting patterns by LittleOwlsHut designers. Instant PDF download in your language, secure checkout."></head><body><title>LittleOwlsHut Patterns</title>
<meta name="description" content="Crochet and amigurumi patterns by LittleOwlsHut designers, with filters by skill level, designer, hook size, language and occasion.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap">
<style>
:root{
  --ground:#FBF6EE; --paper:#FFFDF9; --ink:#3E2A1E; --muted:#7D6A5C; --line:#E7DCCE;
  --accent:#B5603A; --accent-ink:#FFFFFF; --accent-soft:#F4E2D6; --sage:#6E7A52; --sage-soft:#E6E9DB;
  --band:#EFE4D3; --shadow:0 18px 40px -22px rgba(62,42,30,.45);
  --display:"Playfair Display", Georgia, "Times New Roman", serif;
  --body:"Nunito Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#1E1611; --paper:#2A1F18; --ink:#F2E7D9; --muted:#BCA898; --line:#443429;
  --accent:#D9814F; --accent-ink:#1E1611; --accent-soft:#3D2A1F; --sage:#AEB98D; --sage-soft:#2F3226;
  --band:#33271F; --shadow:0 18px 40px -22px rgba(0,0,0,.7); color-scheme:dark; }}
:root[data-theme="dark"]{
  --ground:#1E1611; --paper:#2A1F18; --ink:#F2E7D9; --muted:#BCA898; --line:#443429;
  --accent:#D9814F; --accent-ink:#1E1611; --accent-soft:#3D2A1F; --sage:#AEB98D; --sage-soft:#2F3226;
  --band:#33271F; --shadow:0 18px 40px -22px rgba(0,0,0,.7); color-scheme:dark; }

*{box-sizing:border-box}
body{background:var(--ground); color:var(--ink); font:400 1rem/1.6 var(--body); margin:0; padding-inline:clamp(16px,4vw,48px); padding-bottom:90px}
img,video{max-width:100%; display:block}
a{color:var(--accent)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--accent); outline-offset:3px; border-radius:6px}
h1,h2,h3{font-family:var(--display); font-weight:700; line-height:1.15; text-wrap:balance; margin:0}
h2{font-size:clamp(1.6rem,3vw,2.15rem)}
.wrap{max-width:1180px; margin-inline:auto}
.eyebrow{font:800 .72rem/1 var(--body); letter-spacing:.14em; text-transform:uppercase; color:var(--sage); margin:0 0 8px}
.proto{background:var(--sage-soft); color:var(--ink); font-size:.85rem; padding:.55rem .9rem; border-radius:8px; margin-top:12px}
.note{font-size:.85rem; color:var(--muted); margin:0}

/* top bar */
.top{display:flex; flex-wrap:wrap; gap:12px 20px; align-items:center; justify-content:space-between; padding-block:18px; border-bottom:1px solid var(--line)}
.brand{font-family:var(--display); font-size:1.35rem; font-weight:700; color:var(--ink); text-decoration:none}
.brand span{font-style:italic; font-weight:500; color:var(--accent)}
.top nav{display:flex; gap:18px; font-weight:600; font-size:.95rem}
.top nav a{color:var(--ink); text-decoration:none}
.top nav a:hover{color:var(--accent)}
.prefs{display:flex; gap:8px; align-items:center}
select{font:600 .85rem var(--body); color:var(--ink); background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:.4rem .8rem}
.basket{font:700 .88rem var(--body); background:var(--ink); color:var(--ground); border:0; border-radius:999px; padding:.5rem 1rem; cursor:pointer}
.basket b{display:inline-grid; place-items:center; min-width:1.4em; margin-left:.35em; background:var(--accent); color:var(--accent-ink); border-radius:999px; font-size:.78rem}

.setbtn{display:flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--paper); color:var(--ink); border-radius:999px; padding:.42rem .9rem; font:700 .85rem var(--body); cursor:pointer}
.setbtn svg{width:16px; height:16px; flex:none}
.setbtn .sep{color:var(--line)}
dialog.settings{border:0; border-radius:18px; padding:0; width:min(520px, calc(100% - 32px)); max-height:calc(100% - 32px); background:var(--paper); color:var(--ink); box-shadow:0 30px 80px -20px rgba(30,22,17,.55)}
dialog.settings::backdrop{background:rgba(30,22,17,.45)}
.settings header{display:flex; justify-content:space-between; align-items:center; padding:18px 22px; border-bottom:1px solid var(--line)}
.settings header h2{font-size:1.5rem}
.settings .x{border:0; background:none; font-size:1.6rem; line-height:1; cursor:pointer; color:var(--muted)}
.settings .body{padding:18px 22px; display:grid; gap:18px; overflow:auto}
.settings h3{font:800 .95rem var(--body); margin:0 0 10px}
.opts{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px 16px}
.opts label{display:flex; align-items:center; gap:8px; font-size:.95rem; cursor:pointer}
.opts input{accent-color:var(--accent); width:17px; height:17px}
.auto{display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; margin-top:10px; font-size:.95rem}
.auto select{border-radius:10px}
.settings .info{display:flex; gap:10px; background:var(--sage-soft); border-radius:12px; padding:12px 14px; font-size:.9rem}
.settings .info b{color:var(--sage); font-size:1.1rem; line-height:1.2}
.settings .links{display:flex; gap:14px; margin-top:8px}
.settings .links button{border:0; background:none; padding:0; color:var(--muted); font:600 .82rem var(--body); cursor:pointer; text-decoration:underline}
.settings footer{display:flex; justify-content:flex-end; gap:10px; padding:14px 22px; border-top:1px solid var(--line)}
.settings footer button{border-radius:999px; padding:.65rem 1.3rem; font:800 .95rem var(--body); cursor:pointer; border:1px solid var(--line); background:var(--paper); color:var(--ink)}
.settings footer .primary{background:var(--ink); color:var(--ground); border-color:var(--ink)}
.plchip{display:flex; align-items:center; gap:6px}
.langnote{background:var(--accent-soft); border-radius:12px; padding:10px 14px; font-size:.88rem}
.cnote{font-size:.8rem; color:var(--muted); margin:10px 0 0}
.autobar{background:var(--ink); color:var(--ground); border-radius:10px; padding:.6rem .9rem; font-size:.88rem; margin-top:10px}
.autobar button{border:0; background:none; color:var(--accent-soft); font-weight:800; text-decoration:underline; cursor:pointer}

/* ===== gallery ===== */
.intro{display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); gap:20px 48px; align-items:end; padding-block:clamp(28px,5vw,56px) 22px}
.intro h1{font-size:clamp(2.2rem,5vw,3.6rem)}
.intro h1 em{font-weight:500; color:var(--accent)}
.intro p{margin:0; color:var(--muted); max-width:46ch}
.search{display:flex; gap:8px; background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:6px 6px 6px 18px; align-items:center}
.search input{flex:1; min-width:0; border:0; background:transparent; font:600 1rem var(--body); color:var(--ink); outline:none}
.search button{border:0; background:var(--ink); color:var(--ground); font-weight:800; border-radius:999px; padding:.55rem 1rem; cursor:pointer}

.filters{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--ground); padding-block:12px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center}
.fgroup{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.fgroup > span{font:800 .7rem/1 var(--body); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-right:2px}
.chip{border:1px solid var(--line); background:var(--paper); color:var(--ink); border-radius:999px; padding:.35rem .8rem; font:700 .85rem var(--body); cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--ground); border-color:var(--ink)}
.filters select{padding:.38rem .7rem}
.clear{border:0; background:none; color:var(--accent); font:800 .85rem var(--body); cursor:pointer; text-decoration:underline}
.count{margin-left:auto; font-size:.88rem; color:var(--muted)}

.grid{columns:4 250px; column-gap:18px; padding-block:22px}
.card{break-inside:avoid; margin-bottom:18px; display:block; text-decoration:none; color:var(--ink); background:var(--paper); border-radius:14px; overflow:hidden; border:1px solid var(--line); transition:transform .2s, box-shadow .2s}
.card:hover{transform:translateY(-3px); box-shadow:var(--shadow)}
.card img{width:100%; height:auto}
.card .cb{padding:12px 14px 14px; display:grid; gap:6px}
.card h3{font-size:1.15rem}
.card .by{font-size:.85rem; color:var(--muted)}
.card .row{display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap}
.badge{font:800 .7rem/1 var(--body); letter-spacing:.06em; text-transform:uppercase; padding:.32rem .55rem; border-radius:999px; background:var(--sage-soft); color:var(--ink)}
.flags{display:flex; gap:4px; align-items:center}
.card .price{font:700 1.05rem var(--display)}
.card .pdfl{display:flex; flex-wrap:wrap; gap:2px 6px; align-items:center}
.card .pdfl .lg{white-space:nowrap; display:inline-flex; align-items:center; gap:4px}
.card .pdfl img,.card .pdfl svg{width:18px; height:auto; vertical-align:-3px}
.card .also{font-size:.78rem; color:var(--muted); border-top:1px dashed var(--line); padding-top:6px}
.empty{padding:40px 0; text-align:center; color:var(--muted)}
.ghost{break-inside:avoid; margin-bottom:18px; border:1.5px dashed var(--line); border-radius:14px; padding:22px; color:var(--muted); font-size:.9rem; text-align:center}

/* ===== pattern page ===== */
.crumbs{font-size:.85rem; color:var(--muted); padding-block:14px}
.crumbs a{color:var(--muted)}
.hero{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr); gap:clamp(24px,4vw,56px); align-items:start}
.gallery{position:sticky; top:calc(env(safe-area-inset-top,0px) + 16px); display:grid; gap:14px}
.gallery .stage{position:relative}
.gallery .main{border-radius:14px; overflow:hidden; background:var(--band); aspect-ratio:5/4; box-shadow:var(--shadow)}
.gallery .main img,.gallery .main video{width:100%; height:100%; object-fit:cover}
.arrow{position:absolute; top:50%; transform:translateY(-50%); width:44px; height:44px; border-radius:50%; border:0; background:rgba(255,253,249,.92); color:#3E2A1E; font-size:1.4rem; line-height:1; display:grid; place-items:center; cursor:pointer; box-shadow:0 4px 14px rgba(30,22,17,.25); z-index:2}
.arrow:hover{background:#fff}
.arrow.prev{left:12px} .arrow.next{right:12px}
.pos{position:absolute; right:12px; bottom:12px; background:rgba(30,22,17,.6); color:#fff; font:700 .78rem/1 var(--body); padding:.35rem .6rem; border-radius:999px; font-variant-numeric:tabular-nums; z-index:2}
.thumbs{display:grid; grid-auto-flow:column; grid-auto-columns:calc((100% - 7*8px)/8); gap:8px; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:thin; padding-bottom:4px}
.thumbs button{scroll-snap-align:start}
.thumbs button{padding:0; border:2px solid transparent; border-radius:8px; overflow:hidden; cursor:pointer; background:none; aspect-ratio:5/4}
.thumbs button[aria-current="true"]{border-color:var(--accent)}
.thumbs img{width:100%; height:100%; object-fit:cover}
.thumbs .vid{position:relative}
.thumbs .vid::after{content:"▶"; position:absolute; inset:0; display:grid; place-items:center; color:#fff; font-size:1.1rem; background:rgba(30,22,17,.35)}
.buy{display:grid; gap:14px; position:sticky; top:calc(env(safe-area-inset-top,0px) + 16px)}
.buy h1{font-size:clamp(2.2rem,4.4vw,3.3rem)}
.byline{color:var(--muted); margin-top:-8px}
.byline a{color:var(--ink); font-weight:700; text-decoration-color:var(--accent)}
.lead{font-size:1rem; margin:0}
.same{background:var(--sage-soft); border-radius:12px; padding:12px 14px; font-size:.9rem}
.same a{color:var(--ink); font-weight:800}
.offer{border:1.5px dashed var(--accent); background:var(--accent-soft); border-radius:12px; padding:12px 14px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; justify-content:space-between}
.offer p{margin:0; font-size:.9rem}
.clock{font:800 1.25rem/1 var(--body); font-variant-numeric:tabular-nums; color:var(--accent)}
.clock small{font-size:.62rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-left:2px; margin-right:6px}
.price{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.price .now{font:700 2.1rem/1 var(--display)}
.price s{color:var(--muted); font-size:1.1rem}
.price .approx{font-size:.85rem; color:var(--muted)}
fieldset{border:0; margin:0; padding:0}
legend{font-weight:800; font-size:.85rem; margin-bottom:8px}
.langs{display:flex; flex-wrap:wrap; gap:8px}
.langs label{display:flex; align-items:center; gap:7px; padding:.42rem .75rem; border:1px solid var(--line); border-radius:999px; background:var(--paper); cursor:pointer; font-size:.9rem; font-weight:600}
.langs input{position:absolute; opacity:0; pointer-events:none}
.langs label:has(input:checked){border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink)}
.langs label:has(input:focus-visible){outline:3px solid var(--accent); outline-offset:2px}
.flag{width:21px; height:14px; border-radius:2px; box-shadow:0 0 0 1px rgba(62,42,30,.18); flex:none; display:block; overflow:hidden}
.langs .soon{font-size:.7rem; color:var(--muted); font-weight:700}
.cta{display:flex; width:100%; justify-content:center; align-items:center; gap:10px; font:800 1.05rem var(--body); background:var(--accent); color:var(--accent-ink); border:0; border-radius:12px; padding:1rem 1.2rem; cursor:pointer; text-decoration:none; box-shadow:0 10px 24px -12px var(--accent)}
.cta:hover{filter:brightness(1.06)}
.cta.alt{background:var(--paper); color:var(--ink); border:1.5px solid var(--ink); box-shadow:none}
.trust{display:flex; flex-wrap:wrap; gap:4px 14px; font-size:.85rem; color:var(--muted); margin:0}
.trust span::before{content:"✓ "; color:var(--sage); font-weight:800}

.band{background:var(--band); border-radius:14px; position:relative; overflow:hidden}
.band::before,.band::after{content:""; position:absolute; top:0; bottom:0; width:16px; background:repeating-linear-gradient(0deg,transparent 0 6px,var(--line) 6px 8px)}
.band::before{left:0} .band::after{right:0}
.band dl{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); margin:0; padding:16px 30px; gap:14px 18px}
.band dt{font:800 .7rem/1 var(--body); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:8px}
.band dd{margin:0; font:700 1.1rem/1.25 var(--display)}
.band dd small{display:block; font:600 .76rem/1.35 var(--body); color:var(--muted); margin-top:3px}
.dots{display:flex; gap:4px; margin-top:6px}
.dots i{width:12px; height:12px; border-radius:50%; border:2px solid var(--accent)}
.dots i.on{background:var(--accent)}

section{margin-block:clamp(48px,7vw,88px)}
.split{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:clamp(24px,4vw,56px); align-items:center}
.prose p{max-width:62ch}
.prose h2{margin-bottom:14px}
.inside{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px}
.inside figure{margin:0; background:var(--paper); border:1px solid var(--line); border-radius:12px; overflow:hidden}
.inside figcaption{font-size:.85rem; padding:.6rem .8rem; color:var(--muted)}

.mats{display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:clamp(24px,4vw,48px); margin-top:22px}
.mats h3{font-size:1.25rem; margin-bottom:10px}
.mats ul{list-style:none; margin:0; padding:0; columns:2; column-gap:28px}
.mats li{break-inside:avoid; margin-bottom:10px; padding-left:22px; position:relative; font-size:.95rem}
.mats li::before{content:""; position:absolute; left:0; top:.45em; width:11px; height:11px; border-radius:50%; border:2px solid var(--sage)}
.mats li b{font-weight:800}
.mats li span{color:var(--muted)}
.mats aside{background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:20px 22px; align-self:start}
.mats aside ul{columns:1}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px}
.chips span{background:var(--sage-soft); color:var(--ink); border-radius:999px; padding:.35rem .8rem; font-size:.88rem; font-weight:600}

.videos{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:18px; margin-top:20px}
.vcard{background:var(--paper); border:1px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column}
.vcard video{aspect-ratio:1/1; object-fit:cover; width:100%}
.vcard .yt{aspect-ratio:1/1; width:100%; display:grid; place-items:center; border:0; padding:0; cursor:pointer; background:#000 center/cover no-repeat; color:var(--ink)}
.vcard .yt:hover .play,.vcard .yt:focus-visible .play{transform:scale(1.08)}
.vcard .yt .play{transition:transform .15s; box-shadow:0 4px 18px rgba(0,0,0,.35)}
.vcard iframe.ytf{aspect-ratio:1/1; width:100%; height:auto; border:0; display:block; background:#000}
.vcard .yt .play{width:64px; height:64px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-size:1.4rem; margin-inline:auto}
.vcard p{margin:0; padding:.8rem 1rem; font-weight:700}
.vcard p small{display:block; font-weight:400; color:var(--muted)}

.revs{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:14px; margin-top:18px}
.rev{background:var(--paper); border:1px dashed var(--line); border-radius:14px; padding:18px; display:flex; flex-direction:column; gap:10px}
.rev header{display:flex; justify-content:space-between; align-items:center; color:var(--accent); letter-spacing:1px}
.rev p{margin:0; flex:1; color:var(--muted); font-style:italic}
.rev footer{font-size:.82rem; color:var(--muted)}
.src{font:800 .68rem/1 var(--body); letter-spacing:.1em; text-transform:uppercase; padding:.3rem .55rem; border-radius:999px; color:var(--ground); background:var(--muted)}

.makers{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-top:20px}
.makers figure{margin:0; border-radius:12px; overflow:hidden; aspect-ratio:4/5; background:var(--band)}
.makers img{width:100%; height:100%; object-fit:cover}
.makers .share{display:flex; flex-direction:column; justify-content:center; gap:8px; padding:18px; background:var(--ink); color:var(--ground); border-radius:12px; text-decoration:none}
.makers .share b{font:700 1.7rem/1.1 var(--display); color:var(--accent)}

.pair{display:grid; grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr); gap:clamp(20px,3vw,40px); align-items:center; background:var(--paper); border:1px solid var(--line); border-radius:18px; overflow:hidden; color:var(--ink); text-decoration:none}
.pair img{width:100%; height:100%; object-fit:cover; aspect-ratio:5/4}
.pair > div{padding:clamp(20px,3vw,36px) clamp(20px,3vw,36px) clamp(20px,3vw,36px) 0}
.pair .more{font-weight:800; color:var(--accent)}

.designer{display:grid; grid-template-columns:auto 1fr; gap:22px; align-items:center; background:var(--paper); border:1px solid var(--line); border-radius:18px; padding:clamp(20px,3vw,32px)}
.mono{width:84px; height:84px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; font:700 1.9rem var(--display)}
.designer p{margin:.4rem 0 0; max-width:60ch}
.faq{display:grid; gap:10px; margin-top:18px; max-width:820px}
.faq details{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:.9rem 1.1rem}
.faq summary{font-weight:800; cursor:pointer}
.faq p{margin:.6rem 0 0; color:var(--muted)}
.final{text-align:center; display:grid; gap:14px; justify-items:center}
.final .cta{width:auto; padding-inline:2.2rem}

.mbar{display:none}
.toast{position:fixed; left:50%; bottom:calc(88px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,20px); opacity:0; background:var(--ink); color:var(--ground); padding:.7rem 1.1rem; border-radius:10px; font-weight:700; font-size:.92rem; transition:.25s; pointer-events:none; z-index:30; max-width:calc(100% - 32px)}
.toast.show{opacity:1; transform:translate(-50%,0)}

@media (max-width:860px){
  .intro,.hero,.split,.mats,.videos,.pair{grid-template-columns:minmax(0,1fr)}
  .pair > div{padding:0 20px 22px}
  .buy{position:static} .gallery{position:static} .thumbs{grid-auto-columns:64px}
  .makers{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mats ul{columns:1}
  .top nav{display:none}
  .count{margin-left:0}
  body.pp .mbar{display:flex; position:fixed; left:0; right:0; bottom:0; z-index:20; gap:12px; align-items:center; justify-content:space-between; background:var(--paper); border-top:1px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
  .mbar .cta{width:auto; padding:.8rem 1.2rem; font-size:.95rem}
  .mbar b{font:700 1.3rem var(--display)}
  .mbar small{display:block; color:var(--muted); font-size:.75rem}
}

 "oder passend zu deinem Garn"], ["Stopfnadel", ""], ["Schere und transparenter Kleber", ""]], "techniques": ["Fadenring", "Häkeln in fortlaufenden Runden", "Feste Maschen", "Zunahmen", "Abnahmen", "Einfaches Sticken"], "finalTitle": "Häkle deine eigene kleine Herde", "insideCaptions": {"cover": "Das Titelblatt", "pages": "Alle Seiten auf einen Blick"}}, "FR": {"title": "Petit mouton porte-clés, broche ou petit jouet", "sizeSub": "4,3 pouces de haut", "eyebrow": "Porte-clés amigurumi · broche · petit jouet · facile", "lead": "Un petit mouton tout doux de 11 cm, plein de bouclettes et orné d’un joli nœud. Fais-en un mini doudou, un porte-clés, une broche ou un magnet pour le frigo.", "aboutTitle": "Format poche, tout bouclé et vite fait", "about": ["Le mouton a le dos plat, il se pose donc joliment sur un sac, une veste ou la porte du frigo. Les bouclettes sont crochetées directement sur la tête, et les petites pattes pendantes ajoutent une touche de charme.", "Il demande très peu de laine, parfait pour tes restes. Crochète tout un troupeau en marron, crème, rose et gris : ce sont de jolis petits cadeaux pour les amis, les maîtresses ou les swaps."], "yarn": ["YarnArt Jeans ou similaire", "coton-acrylique, 160 m / 50 g"], "materials": [["Fil YarnArt Jeans", "marron (principal), beige (museau, oreilles, sabots), blanc (yeux) et rose (nœud, joues) ; ou tout fil lisse d’épaisseur similaire"], ["Fil noir ou fil à broder", "pour le nez"], ["Rembourrage pour jouets", "une petite quantité"], ["Demi-perles, 5 mm", "ou autres yeux pour jouets, plus de la colle"], ["En option", "anneau porte-clés, attache de broche ou aimant"]], "tools": [["Crochet 2 mm", "ou la taille adaptée à ton fil"], ["Aiguille à laine", ""], ["Ciseaux et colle transparente", ""]], "techniques": ["Cercle magique", "Tours en spirale", "Maille serrée", "Augmentation", "Diminution", "Broderie simple"], "finalTitle": "Commence ton propre petit troupeau", "insideCaptions": {"cover": "La couverture", "pages": "Toutes les pages en un coup d’œil"}}, "IT": {"title": "Pecorella portachiavi, spilla o piccolo amigurumi", "sizeSub": "4,3 pollici di altezza", "eyebrow": "Portachiavi amigurumi · spilla · piccolo pupazzo · facile", "lead": "Una pecorella soffice, alta 11 cm, tutta riccioli e con un dolce fiocchetto. Puoi farla come piccolo pupazzo, portachiavi, spilla o calamita da frigo.", "aboutTitle": "Tascabile, riccioluta e veloce da realizzare", "about": ["La pecorella ha il retro piatto, così sta bene appesa alla borsa, appuntata sulla giacca o sulla porta del frigo. I riccioli si lavorano direttamente sulla testa e le zampette penzolano per un tocco di simpatia in più.", "Serve pochissimo filato, quindi è perfetta per usare gli avanzi. Crea un intero gregge in marrone, crema, rosa e grigio: sono piccoli regali deliziosi per amiche, maestre e scambi."], "yarn": ["YarnArt Jeans o simile", "cotone-acrilico, 160 m / 50 g"], "materials": [["Filato YarnArt Jeans", "marrone (principale), beige (muso, orecchie, zoccoli), bianco (occhi) e rosa (fiocco, guance); oppure un filato liscio di spessore simile"], ["Filato nero o filo da ricamo", "per il naso"], ["Imbottitura", "una piccola quantità"], ["Mezze perle da 5 mm", "o altri occhietti, più colla"], ["Facoltativo", "anello portachiavi, base per spilla o calamita"]], "tools": [["Uncinetto da 2 mm", "o la misura adatta al tuo filato"], ["Ago da lana", ""], ["Forbici e colla trasparente", ""]], "techniques": ["Anello magico", "Giri a spirale", "Maglia bassa", "Aumenti", "Diminuzioni", "Ricamo semplice"], "finalTitle": "Inizia il tuo piccolo gregge", "insideCaptions": {"cover": "La copertina", "pages": "Tutte le pagine in un colpo d'occhio"}}, "NL": {"title": "Schaapje als sleutelhanger, broche of klein knuffeltje", "sizeSub": "11 cm hoog", "eyebrow": "Amigurumi sleutelhanger · broche · klein knuffeltje · makkelijk", "lead": "Een zacht klein schaapje van 11 cm, vol krulletjes en afgewerkt met een lief strikje. Maak het als mini-knuffel, sleutelhanger, broche of koelkastmagneet.", "aboutTitle": "Zakformaat, krullerig en snel gehaakt", "about": ["Het schaapje heeft een platte achterkant, dus het zit mooi op een tas, een jas of de koelkastdeur. De krulletjes haak je direct op het hoofd, en de bungelende pootjes maken het extra schattig.", "Je hebt maar een klein beetje garen nodig, dus het is perfect voor restjes. Haak een hele kudde in bruin, crème, roze en grijs: leuke kleine cadeautjes voor vriendinnen, juffen en meesters, of om te ruilen."], "yarn": ["YarnArt Jeans of vergelijkbaar", "katoen-acryl, 160 m / 50 g"], "materials": [["Garen YarnArt Jeans", "bruin (hoofdkleur), beige (snuit, oren, hoefjes), wit (ogen) en roze (strikje, wangetjes); of een ander glad garen van vergelijkbare dikte"], ["Zwart garen of borduurgaren", "voor het neusje"], ["Vulling", "een klein beetje"], ["Halve kraaltjes, 5 mm", "of andere speelgoedoogjes, plus lijm"], ["Optioneel", "sleutelhangerring, broche-speld of magneet"]], "tools": [["Haaknaald 2 mm", "of de maat die bij je garen past"], ["Stopnaald", ""], ["Schaar en transparante lijm", ""]], "techniques": ["Magische ring", "Haken in spiraal", "Vasten", "Meerderen", "Minderen", "Eenvoudig borduurwerk"], "finalTitle": "Begin je eigen kleine kudde", "insideCaptions": {"cover": "De voorpagina", "pages": "Alle pagina's in één oogopslag"}}, "PL": {"title": "Mała owieczka – brelok, broszka lub mała zabawka", "sizeSub": "4,3 cala wysokości", "eyebrow": "Brelok amigurumi · broszka · mała zabawka · łatwy", "lead": "Puszysta owieczka o wysokości 11 cm, cała w loczkach, z uroczą kokardką. Zrób z niej malutką zabawkę, brelok, broszkę albo magnes na lodówkę.", "aboutTitle": "Kieszonkowa, kręcona i szybka do zrobienia", "about": ["Owieczka ma płaskie plecy, więc ładnie leży na torbie, kurtce czy drzwiach lodówki. Loczki dziergasz od razu na główce, a dyndające nóżki dodają jej uroku.", "Potrzebujesz tylko odrobiny włóczki, więc to idealny sposób na resztki. Wydziergaj całe stadko – brązowe, kremowe, różowe i szare: to śliczne drobne prezenty dla przyjaciół, nauczycieli i na wymianki."], "yarn": ["YarnArt Jeans lub podobna", "bawełna z akrylem, 160 m / 50 g"], "materials": [["Włóczka YarnArt Jeans", "brązowa (główny kolor), beżowa (pyszczek, uszy, kopytka), biała (oczy) i różowa (kokardka, policzki); albo dowolna gładka włóczka o podobnej grubości"], ["Czarna włóczka lub mulina", "na nosek"], ["Wypełnienie do zabawek", "niewielka ilość"], ["Półkoraliki, 5 mm", "lub inne oczka do zabawek, plus klej"], ["Opcjonalnie", "zawieszka do breloka, zapięcie do broszki lub magnes"]], "tools": [["Szydełko 2 mm", "lub w rozmiarze dopasowanym do włóczki"], ["Igła z tępym końcem", ""], ["Nożyczki i przezroczysty klej", ""]], "techniques": ["Magiczne kółko", "Dzierganie spiralą", "Półsłupki", "Dodawanie oczek", "Ujmowanie oczek", "Prosty haft"], "finalTitle": "Zacznij własne małe stadko", "insideCaptions": {"cover": "Okładka wzoru", "pages": "Wszystkie strony w skrócie"}}}, "eyebrow": "Amigurumi keyring · brooch · small toy · easy", "lead": "A fluffy little sheep, 11 cm tall, full of curls and finished with a sweet bow. Make it as a tiny toy, a keyring, a brooch or a fridge magnet.", "aboutTitle": "Pocket-sized, curly and quick to make", "about": ["The sheep has a flat back, so it sits neatly on a bag, a jacket or the fridge door. The curls are crocheted straight onto the head, and the little legs dangle for extra charm.", "It takes only a little yarn, so it's perfect for leftovers. Make a whole flock in brown, cream, pink and grey: they make lovely small gifts for friends, teachers and swaps."], "yarn": ["YarnArt Jeans or similar", "cotton-acrylic, 160 m / 50 g"], "materials": [["YarnArt Jeans yarn", "brown (main), beige (muzzle, ears, hooves), white (eyes) and pink (bow, cheeks); or any smooth yarn of similar weight"], ["Black yarn or embroidery floss", "for the nose"], ["Toy stuffing", "a small amount"], ["Half-beads, 5 mm", "or other toy eyes, plus glu karierter Leinenrock, ein Unterrock und eine Bluse mit Spitzenbesatz, eine Schürze, Pumphosen und eine Fellweste."], "yarn": ["Lace-Stärke", "YarnArt Jeans in zwei Fäden geteilt, 1 Knäuel"], "materials": [["Beiges Garn", "YarnArt „Jeans“, in zwei Fäden geteilt. 1 Knäuel (oder ein Garn mit 320 m / 50 g, ungeteilt)"], ["Weißes Garn für die Augen", "Kartopu „Nubuk“, eine kleine Menge"], ["Kupferdraht", "PVC-ummantelt, einadrig, 3 mm, ca. 150 cm, für das Gerüst"], ["Textilklebeband", "1 cm breit, zum Umwickeln des Drahts"], ["Füllwatte", "beliebige Sorte"], ["Glas- oder Metallperlen", "optional, zum Beschweren"], ["Weiße Modelliermasse", "für die Zähne"], ["Glasaugen", "5–6 mm"], ["Schwarze Angelschnur", "für die Wimpern"], ["Filzwolle", "Weiß und Grau für das Haar (optional etwas mehr für die Stiefel)"], ["Puppenbrille", "6,5 cm breit"], ["Perlen, Schlüssel, Schlüsselring, ein Ohrring", "für ihre Accessoires"], ["Leinen- und Fellstoff", "kariertes, gebleichtes und naturfarbenes Leinen, Stretch-Baumwolle, Fell (Maße in der Anleitung)"], ["Spitzen und Borten", "Wellen- und Picot-Leinenspitze, Schrägband, elastische Spitze, Rundgummi"], ["Nähgarn und transparenter Kleber", ""]], "tools": [["Häkelnadel 1,0 mm", "US 12 / UK 6½"], ["Maschenmarkierer", "oder ein Stück Garn in Kontrastfarbe"], ["Stopfnadel und Nähnadel", ""], ["Filznadel", ""], ["Holzstäbchen", "zum Ausstopfen schmaler Teile"]], "techniques": ["Häkeln in Runden", "Häkeln in Reihen", "fM · Stb", "Zunahmen & Abnahmen", "Drahtgerüst", "Nadelfilzen", "Kleidung nähen"], "finalTitle": "Häkle sie rechtzeitig zu Halloween", "insideCaptions": {"cover": "Titelblatt und Materialseite", "pages": "Alle 30 Seiten auf einen Blick", "body": "Der Körper mit Drahtgerüst, noch ohne Kleidung", "boots": "Genähte Pumphosen und gefilzte Stiefel"}, "watchTitle": "Sieh sie dir in Bewegung an – und lerne dann die knifflige Nase", "watchPreviewSub": "Die fertige Puppe, in Pose und von allen Seiten"}, "FR": {"title": "Charmante sorcière", "sizeSub": "15 pouces de haut", "eyebrow": "Poupée d’art amigurumi · crochet + couture", "lead": "Une sorcière de 38 cm sur armature en fil de cuivre, avec ses lunettes, ses cheveux feutrés en bataille, son trousseau de clés et toute une garde-robe en lin. Chaque maille est montrée en photos.", "aboutTitle": "Des lunettes sur le nez et des clés à la ceinture", "about": ["Voici un patron pour les passionnées de détails. Le corps est crocheté serré en spirale continue autour d’une armature en fil de cuivre : une fois terminée, la sorcière peut s’asseoir, tenir debout, porter un balai et te regarder par-dessus ses lunettes.", "Son visage est façonné avec un nez crocheté et modelé, et des dents en pâte polymère. Ses cheveux sont feutrés en laine blanche et grise. Le patron comprend aussi toute sa garde-robe à coudre : une jupe en lin à carreaux, un jupon et un chemisier bordés de dentelle, un tablier, une culotte bouffante et un gilet en fourrure."], "yarn": ["Fil lace", "YarnArt Jeans dédoublé, 1 pelote"], "materials": [["Fil beige", "YarnArt « Jeans », dédoublé en deux brins. 1 pelote (ou un fil de 320 m / 50 g, non dédoublé)"], ["Fil blanc pour les yeux", "Kartopu « Nubuk », une petite quantité"], ["Fil de cuivre", "monobrin gainé PVC, 3 mm, environ 150 cm, pour l’armature"], ["Ruban adhésif en tissu", "1 cm de large, pour envelopper le fil de fer"], ["Rembourrage", "de n’importe quel type"], ["Perles en verre ou en métal", "en option, pour lester"], ["Pâte polymère blanche", "pour les dents"], ["Yeux en verre", "5–6 mm"], ["Fil de pêche noir", "pour les cils"], ["Laine à feutrer", "blanche et grise pour les cheveux (plus un peu pour les bottines, en option)"], ["Lunettes pour poupée", "6,5 cm de large"], ["Perles, clés, anneau porte-clés, une boucle d’oreille", "pour ses accessoires"], ["Lin et tissu fourrure", "lin à carreaux, lin blanchi et lin naturel, coton stretch, fourrure (dimensions dans le patron)"], ["Dentelles et galons", "dentelle de lin ondulée et à picots, biais, dentelle élastique, élastique rond"], ["Fil à coudre et colle transparente", ""]], "tools": [["Crochet 1,0 mm", "US 12 / UK 6½"], ["Marqueur de mailles", "ou un bout de fil de couleur contrastée"], ["Aiguille à laine et aiguille à coudre", ""], ["Aiguille à feutrer", ""], ["Bâtonnet en bois", "pour rembourrer les parties étroites"]], "techniques": ["Crochet en rond", "Crochet en rangs", "ms · B", "Augmentations et diminutions", "Armature en fil de fer", "Feutrage à l’aiguille", "Couture de vêtements"], "finalTitle": "Crochète-la à temps pour Halloween", "insideCaptions": {"cover": "La couverture et la page du matériel", "pages": "Les 30 pages en un coup d’œil", "body": "Le corps avec son armature, avant l’habillage", "boots": "Culotte bouffante cousue et bottines feutrées"}, "watchTitle": "Regarde-la bouger, puis apprends le nez délicat", "watchPreviewSub": "La poupée terminée, mise en pose et sous tous ses angles"}, "IT": {"title": "Strega affascinante", "sizeSub": "15 pollici di altezza", "eyebrow": "Bambola d'arte amigurumi · uncinetto + cucito", "lead": "Una strega di 38 cm su un'armatura di filo di rame, con occhiali, capelli infeltriti tutti scompigliati, un mazzo di chiavi e un intero guardaroba di lino. Ogni punto è mostrato in foto.", "aboutTitle": "Occhiali sul naso e chiavi alla cintura", "about": ["Questo è uno schema per chi ama i dettagli. Il corpo si lavora fitto a spirale continua sopra un'armatura di filo di rame, così la strega finita può sedersi, stare in piedi, tenere in mano una scopa e sbirciarti da sopra gli occhiali.", "Il viso prende forma grazie a un naso modellato all'uncinetto e a dentini in pasta polimerica. I capelli sono infeltriti con lana bianca e grigia. Lo schema comprende anche tutto il suo guardaroba da cucire: una gonna di lino a quadri, sottogonna e camicetta con bordi di pizzo, un grembiule, mutandoni e un gilet di pelliccia."], "yarn": ["Filato sottile (lace)", "YarnArt Jeans diviso in due fili, 1 gomitolo"], "m ken + naaien", "lead": "Een heks van 38 cm op een frame van koperdraad, met een bril, wild gevilt haar, een sleutelbos en een complete linnen garderobe. Elke steek wordt met foto's uitgelegd.", "aboutTitle": "Een bril op haar neus en sleutels aan haar riem", "about": ["Dit is een patroon voor wie van details houdt. Het lijf haak je stevig in een doorlopende spiraal over een frame van koperdraad, zodat de heks kan zitten, staan, een bezem vasthouden en over haar brilletje heen kijken.", "Haar gezichtje krijgt vorm met een gehaakte, geboetseerde neus en tandjes van polymeerklei. Haar haar vilt je van witte en grijze wol. In het patroon zit ook haar complete garderobe om zelf te naaien: een geruite linnen rok, een onderrok en blouse met kantjes, een schort, een pofbroekje en een bontvestje."], "yarn": ["Lace-dikte", "YarnArt Jeans in twee draden gesplitst, 1 bol"], "materials": [["Beige garen", "YarnArt “Jeans”, in twee draden gesplitst. 1 bol (of een garen van 320 m / 50 g, niet gesplitst)"], ["Wit garen voor de ogen", "Kartopu “Nubuk”, een klein beetje"], ["Koperdraad", "met pvc-mantel, 3 mm dik, ca. 150 cm, voor het frame"], ["Textieltape", "1 cm breed, om het draad mee te omwikkelen"], ["Vulling", "elke soort"], ["Glazen of metalen kralen", "optioneel, voor extra gewicht"], ["Witte polymeerklei", "voor de tanden"], ["Glazen oogjes", "5–6 mm"], ["Zwarte vislijn", "voor de wimpers"], ["Viltwol", "wit en grijs voor het haar (plus wat voor de laarsjes, optioneel)"], ["Poppenbrilletje", "6,5 cm breed"], ["Kralen, sleutels, sleutelring, een oorbel", "voor haar accessoires"], ["Linnen en bontstof", "geruit, gebleekt en naturel linnen, stretchkatoen, bont (maten staan in het patroon)"], ["Kant en band", "golvend linnen kant en picotkant, biaisband, elastisch kant, rond elastiek"], ["Naaigaren en transparante lijm", ""]], "tools": [["Haaknaald 1,0 mm", "US 12 / UK 6½"], ["Steekmarkeerder", "of een stukje garen in een contrasterende kleur"], ["Stopnaald en naainaald", ""], [ 0,al_c,q_85,enc_auto/752f67_30a1278de26b43e38aec0b9cdc1a44b0~mv2.jpg", "https://static.wixstatic.com/media/752f67_7804c2b4702f4c8ba997d61afb025756~mv2.jpg/v1/fill/w_1400,h_1120,al_c,q_85,enc_auto/752f67_7804c2b4702f4c8ba997d61afb025756~mv2.jpg", "https://static.wixstatic.com/media/752f67_90d2e554acf94435a1247d834b15d333~mv2.jpg/v1/fill/w_1400,h_1120,al_c,q_85,enc_auto/752f67_90d2e554acf94435a1247d834b15d333~mv2.jpg", "https://static.wixstatic.com/media/752f67_3fe1775632694e70a448bde50d284b8f~mv2.jpg/v1/fill/w_1400,h_1120,al_c,q_85,enc_auto/752f67_3fe1775632694e70a448bde50d284b8f~mv2.jpg", "https://static.wixstatic.com/media/752f67_1ff597dc228c42a0a723ebf39bb0151b~mv2.jpg/v1/fill/w_1400,h_1120,al_c,q_85,enc_auto/752f67_1ff597dc228c42a0a723ebf39bb0151b~mv2.jpg"], "card": "https://static.wixstatic.com/media/752f67_e3be17d7fb524b7fb44a7fb87808accb~mv2.jpg/v1/fill/w_700,h_560,al_c,q_85,enc_auto/752f67_e3be17d7fb524b7fb44a7fb87808accb~mv2.jpg"}, "insideCaptions": {"cover": "The cover and materials page", "pages": "All 22 pages at a glance"}, "watchTitle": "", "watchPreviewSub": "", "tr": {"DA": {"title": "Marie, juletræsdukken", "sizeSub": "5,1 tommer høj (siddende)", "sameAsNote": "Samme mønster som “Marie, den lille heksedukke”, bare hæklet i andre farver. Det er én PDF, så du behøver kun at købe den ene af dem.", "eyebrow": "Amigurumi-dukke · trådramme", "lead": "En lille grøn dukke klædt ud som juletræ, med filtet hår, en spids hat med bittesmå julekugler og en trådramme, så hun kan sidde og vinke. 13 cm høj, når hun sidder.", "aboutTitle": "Et juletræ med et drilsk smil", "about": ["Marie hækles i tyndt garn (fingering) omkring en tynd kobbertrådsramme, så hendes arme og ben kan bøjes, og hun kan sidde på en hylde eller en gren. Øjnene formes af polymer-ler, og håret filtes af grøn uld.", "Pynt hendes hat med små klokker og perler, og giv kinderne lidt farve med øjenskygge eller oliekridt. Hækl et par stykker i forskellige grønne nuancer, så har du en hel lille skov."], "yarn": ["Fingering / 4 ply", "3 farver, ca. 400 m / 100 g"], "materials": [["Grønt garn", "ca. 25 g, til krop, hat, arme og ben"], ["Beige eller lyserødt garn", "ca. 15 g, til hoved, næse og ører"], ["Hvidt garn", "en lille smule, til krave og sokker"], ["Polymer-ler", "en lille smule, til det hvide i øjnene"], ["Små sorte perler eller sikkerhedsøjne", "5 mm, til pupillerne"], ["Kobbertråd", "massiv, 1 mm, ca. 200 cm, til rammen"], ["Grøn filtuld", "til håret, med lidt brun"], ["Fyld", "hvilken som helst slags"], ["Klar lim og sytråd", ""], ["Kunstige øjenvipper", "valgfrit"], ["Små klokker, perler og kugler", "valgfrit, til hatten"], ["Øjenskygge eller oliekridt", "valgfrit, til kinderne"]], "tools": [["Hæklenål i stål, 2 mm", "US 4 / UK 2½"], ["Maskemarkør", ""], ["Stoppenål", ""], ["Filtenål", "valgfrit, til håret"]], "techniques": ["Hækling i omgange", "Fastmasker", "Udtagninger og indtagninger", "Trådramme", "Nålefiltning"], "finalTitle": "Hækl hende før jul", "insideCaptions": {"cover": "Forsiden og materialesiden", "pages": "Alle 22 sider på ét blik"}}, "DE": {"title": "Puppe Tania die Tanne", "sizeSub": "5,1 Zoll hoch (sitzend)", "sameAsNote": "Dieselbe Anleitung wie „Tania die kleine Hexe“, nur in anderen Farben gehäkelt. Es ist ein einziges PDF – du brauchst also nur eine der beiden zu kaufen.", "eyebrow": "Amigurumi-Puppe · Drahtgerüst", "lead": "Eine kleine grüne Puppe im Tannenbaum-Kostüm, mit gefilztem Haar, einer spitzen Mütze voller Mini-Christbaumschmuck und einem Drahtgerüst, damit sie sitzen und winken kann. Sitzend 13 cm hoch.", "aboutTitle": "Ein Tannenbaum mit frechem Grinsen", "about": ["Tania wird aus feinem Garn (Fingering) über ein dünnes Kupferdrahtgerüst gehäkelt – so lassen sich Arme und Beine biegen, und sie kann auf einem Regal oder einem Zweig sitzen. Ihre Augen werden aus Modelliermasse geformt, das Haar aus grüner Wolle gefilzt.", "Schmücke ihre Mütze mit kleinen Glöckchen und Perlen und färbe die Wangen mit etwas Lidschatten oder Pastellkreide. Häkle gleich mehrere in verschiedenen Grüntönen – für einen ganzen kleinen Wald."], "yarn": ["Fingering / 4-fädig", "3 Farben, ca. 400 m / 100 g"], "materials": [["Grünes Garn", "ca. 25 g, für Körper, Mütze, Arme und Beine"], ["Beiges oder rosa Garn", "ca. 15 g, für Kopf, Nase und Ohren"], ["Weißes Garn", "eine kleine Menge, für Kragen und Socken"], ["Modelliermasse", "eine kleine Menge, für das Weiße der Augen"], ["Kleine schwarze Perlen oder Sicherheitsaugen", "5 mm, für die Pupillen"], ["Kupferdraht", "einadrig, 1 mm, ca. 200 cm, für das Gerüst"], ["Grüne Filzwolle", "für das Haar, dazu etwas Braun"], ["Füllwatte", "beliebige Sorte"], ["Transparenter Kleber und Nähgarn", ""], ["Künstliche Wimpern", "optional"], ["Kleine Glöckchen, Perlen und Kugeln", "optional, für die Mütze"], ["Lidschatten oder Pastellkreide", "optional, zum Färben der Wangen"]], "tools": [["Stahlhäkelnadel 2 mm", "US 4 / UK 2½"], ["Maschenmarkierer", ""], ["Stopfnadel", ""], ["Filznadel", "optional, für das Haar"]], "techniques": ["Häkeln in Runden", "Feste Maschen", "Zunahmen & Abnahmen", "Drahtgerüst", "Nadelfilzen"], "finalTitle": "Häkle sie noch vor Weihnachten", "insideCaptions": {"cover": "Titelblatt und Materialseite", "pages": "Alle 22 Seiten auf einen Blick"}}, "FR": {"title": "Marie, la poupée sapin de Noël", "sizeSub": "5,1 pouces de haut (assise)", "sameAsNote": "Même patron que « Marie, la petite poupée sorcière », crocheté dans d’autres couleurs. C’est un seul et même PDF : tu n’as besoin d’en acheter qu’un des deux.", "eyebrow": "Poupée amigurumi · armature en fil de fer", "lead": "Une petite poupée verte déguisée en sapin de Noël, avec des cheveux feutrés, un chapeau pointu orné de mini décorations et une armature en fil de fer pour qu’elle puisse s’asseoir et faire coucou. 13 cm de haut en position assise.", "aboutTitle": "Un sapin de Noël au sourire malicieux", "about": ["Marie est crochetée en fil fingering autour d’une fine armature en fil de cuivre : ses bras et ses jambes se plient, et elle peut se percher sur une étagère ou une branche. Ses yeux sont modelés en pâte polymère et ses cheveux feutrés en laine verte.", "Décore son chapeau de clochettes et de perles, et colore ses joues avec un peu de fard à paupières ou de pastel à l’huile. Crochètes-en plusieurs dans différents verts pour créer toute une petite forêt."], "yarn": ["Fingering / 4 fils", "3 couleurs, environ 400 m / 100 g"], "materials": [["Fil vert", "environ 25 g, pour le corps, le chapeau, les bras et les jambes"], ["Fil beige ou rose", "environ 15 g, pour la tête, le nez et les oreilles"], ["Fil blanc", "une petite quantité, pour le col et les chaussettes"], ["Pâte polymère", "une petite quantité, pour le blanc des yeux"], ["Petites perles noires ou yeux de sécurité", "5 mm, pour les pupilles"], ["Fil de cuivre", "monobrin, 1 mm, environ 200 cm, pour l’armature"], ["Laine à feutrer verte", "pour les cheveux, avec un peu de marron"], ["Rembourrage", "de n’importe quel type"], ["Colle transparente et fil à coudre", ""], ["Faux cils", "en option"], ["Petites clochettes, perles et boules", "en option, pour le chapeau"], ["Fard à paupières ou pastel à l’huile", "en option, pour colorer les joues"]], "tools": [["Crochet acier 2 mm", "US 4 / UK 2½"], ["Marqueur de mailles", ""], ["Aiguille à laine", ""], ["Aiguille à feutrer", "en option, pour les cheveux"]], "techniques": ["Crochet en rond", "Maille serrée", "Augmentations et diminutions", "Armature en fil de fer", "Feutrage à l’aiguille"], "finalTitle": "Crochète-la avant Noël", "insideCaptions": {"cover": "La couverture et la page du matériel", "pages": "Les 22 pages en un coup d’œil"}}, "IT": {"title": "Bambolina Natalina", "sizeSub": "5,1 pollici di altezza (da seduta)", "sameAsNote": "Stesso schema della “Bambolina Streghetta”, lavorato in colori diversi. È un unico PDF, quindi ti basta acquistarne uno.", "eyebrow": "Bambolina amigurumi · armatura di filo metallico", "lead": "Una piccola bambola verde vestita da albero di Natale, con capelli infeltriti, un cappello a punta pieno di mini decorazioni e un'armatura di filo metallico per farla sedere e salutare. Alta 13 cm da seduta.", "aboutTitle": "Un albero di Natale con un sorriso birichino", "about": ["Natalina si lavora con un filato sottile (4 ply) sopra un'armatura di sottile filo di rame, così braccia e gambe si piegano e lei può appollaiarsi su una mensola o su un ramo. Gli occhi sono modellati in pasta polimerica e i capelli sono infeltriti con lana verde.", "Decora il cappello con campanellini e perline e colora le guance con un po' di ombretto o pastello a olio. Creane qualcuna in diverse tonalità di verde per un intero boschetto."], "yarn": ["Fingering / 4 ply", "3 colori, circa 400 m / 100 g"], "materials": [["Filato verde", "circa 25 g, per corpo, cappello, braccia e gambe"], ["Filato beige o rosa", "circa 15 g, per testa, naso e orecchie"], ["Filato bianco", "un po', per colletto e calzini"], ["Pasta polimerica", "un po', per il bianco degli occhi"], ["Perline nere o occhi di sicurezza", "5 mm, per le pupille"], ["Filo di rame", "unipolare, 1 mm, circa 200 cm, per l'armatura"], ["Lana verde da infeltrire", "per i capelli, con un po' di marrone"], ["Imbottitura", "di qualsiasi tipo"], ["Colla trasparente e filo da cucito", ""], ["Ciglia finte", "facoltative"], ["Campanellini, perline e palline", "facoltativi, per il cappello"], ["Ombretto o pastello a olio", "facoltativo, per colorare le guance"]], "tools": [["Uncinetto d'acciaio da 2 mm", "US 4 / UK 2½"], ["Segnapunti", ""], ["Ago da lana", ""], ["Ago per infeltrire", "facoltativo, per i capelli"]], "techniques": ["Lavorazione in giri", "Maglia bassa", "Aumenti e diminuzioni", "Armatura di filo metallico", "Infeltrimento ad ago"], "finalTitle": "Preparala prima di Natale", "insideCaptions": {"cover": "La copertina e la pagina dei materiali", "pages": "Tutte le 22 pagine in un colpo d'occhio"}}, "NL": {"title": "Pop Marie de Kerstboom", "sizeSub": "13 cm hoog (zittend)", "sameAsNote": "Hetzelfde patroon als “Pop Marie het Heksje”, gehaakt in andere kleuren. Het is één PDF, dus je hoeft er maar één van te kopen.", "eyebrow": "Amigurumi pop · draadframe", "lead": "Een klein groen popje verkleed als kerstboom, met gevilt haar, een puntmuts vol mini-kerstballen en een frame van draad, zodat ze kan zitten en zwaaien. Zittend 13 cm hoog.", "aboutTitle": "Een kerstboom met een ondeugende grijns", "about": ["Marie haak je van dun garen (fingering) over een frame van dun koperdraad, zodat haar armen en benen buigen en ze op een plankje of een tak kan zitten. Haar oogjes maak je van polymeerklei, en haar haar vilt je van groene wol.", "Versier haar muts met belletjes en kraaltjes, en geef haar wangetjes een blosje met wat oogschaduw of pastelkrijt. Haak er een paar in verschillende tinten groen voor een heel klein bos."], "yarn": ["Fingering / 4 ply", "3 kleuren, ca. 400 m / 100 g"], "materials": [["Groen garen", "ca. 25 g, voor lijf, muts, armen en benen"], ["Beige of roze garen", "ca. 15 g, voor hoofd, neus en oren"], ["Wit garen", "een klein beetje, voor kraagje en sokjes"], ["Polymeerklei", "een klein beetje, voor het wit van de ogen"], ["Kleine zwarte kraaltjes of veiligheidsoogjes", "5 mm, voor de pupillen"], ["Koperdraad", "massief, 1 mm, ca. 200 cm, voor het frame"], ["Groene viltwol", "voor het haar, met een beetje bruin"], ["Vulling", "elke soort"], ["Transparante lijm en naaigaren", ""], ["Nepwimpers", "optioneel"], ["Belletjes, kraaltjes en kerstballetjes", "optioneel, voor de muts"], ["Oogschaduw of pastelkrijt", "optioneel, voor blosjes op de wangen"]], "tools": [["Stalen haaknaald 2 mm", "US 4 / UK 2½"], ["Steekmarkeerder", ""], ["Stopnaald", ""], ["Viltnaald", "optioneel, voor het haar"]], "techniques": ["Haken in toeren", "Vasten", "Meerderen & minderen", "Frame van draad", "Naaldvilten"], "finalTitle": "Haak haar nog vóór de kerst", "insideCaptions": {"cover": "De voorpagina en de materialenpagina", "pages": "Alle 22 pagina's in één oogopslag"}}, "PL": {"title": "Lalka Marie – choinka", "sizeSub": "5,1 cala wysokości (na siedząco)", "sameAsNote": "To ten sam wzór co „Lalka Marie – mała czarownica”, tylko wydziergany w innych kolorach. To jeden PDF, więc wystarczy kupić jeden z nich.", "eyebrow": "Lalka amigurumi · stelaż z drutu", "lead": "Mała zielona laleczka przebrana za choinkę, z filcowanymi włosami, spiczastą czapką obwieszoną malutkimi ozdobami i stelażem z drutu, dzięki któremu może siedzieć i machać. 13 cm wysokości na siedząco.", "aboutTitle": "Choinka z łobuzerskim uśmiechem", "about": ["Marie dziergasz z cienkiej włóczki (fingering) na stelażu z cienkiego miedzianego drutu, więc jej rączki i nóżki się zginają, a ona może przycupnąć na półce albo gałązce. Oczy są wymodelowane z masy polimerowej, a włosy wyfilcowane z zielonej wełny.", "Udekoruj jej czapkę malutkimi dzwoneczkami i koralikami, a policzki zaróżuj odrobiną cienia do powiek lub suchej pasteli. Wydziergaj kilka w różnych odcieniach zieleni, a powstanie cały mały las."], "yarn": ["Fingering / 4 ply", "3 kolory, ok. 400 m / 100 g"], "materials": [["Zielona włóczka", "ok. 25 g, na tułów, czapkę, rączki i nóżki"], ["Beżowa lub różowa włóczka", "ok. 15 g, na głowę, nos i uszy"], ["Biała włóczka", "niewielka ilość, na kołnierzyk i skarpetki"], ["Masa polimerowa", "niewielka ilość, na białka oczu"], ["Małe czarne koraliki lub oczka z zabezpieczeniem", "5 mm, na źrenice"], ["Miedziany drut", "jednożyłowy, 1 mm, ok. 200 cm, na stelaż"], ["Zielona wełna do filcowania", "na włosy, z odrobiną brązowej"], ["Wypełnienie", "dowolne"], ["Przezroczysty klej i nici do szycia", ""], ["Sztuczne rzęsy", "opcjonalnie"], ["Małe dzwoneczki, koraliki i bombki", "opcjonalnie, na czapkę"], ["Cień do powiek lub sucha pastela", "opcjonalnie, do zaróżowienia policzków"]], "tools": [["Stalowe szydełko 2 mm", "US 4 / UK 2½"], ["Znacznik oczek", ""], ["Igła z tępym końcem", ""], ["Igła do filcowania", "opcjonalnie, do włosów"]], "techniques": ["Dzierganie w okrążeniach", "Półsłupki", "Dodawanie i ujmowanie oczek", "Stelaż z drutu", "Filcowanie na sucho"], "finalTitle": "Wydziergaj ją przed świętami", "insideCaptions": {"cover": "Okładka i strona z materiałami", "pages": "Wszystkie 22 strony w skrócie"}}}, "eyebrow": "Amigurumi doll · wire frame", "lead": "A little green doll dressed as a Christmas tree, with felted hair, a pointed hat hung with tiny ornaments, and a wire frame so she can sit and wave. 13 cm tall when seated.", "aboutTitle": "A Christmas tree with a mischievous grin", "about": ["Marie is crocheted in fingering-weight yarn over a thin copper-wire frame, so her arms and legs bend and she can perch on a shelf or a branch. Her eyes are shaped from polymer clay, and her hair is felted from green wool.", "Decorate her hat with tiny bells and beads, and tint her cheeks with a little eyeshadow or oil pastel. Crochet a few in different greens for a whole little forest."], "yarn": ["Fingering / 4 ply", "3 colours, about 400 m / 100 g"], "materials": [["Green yarn", "about 25 g, for the body, hat, arms and legs"], ["Beige or pink yarn", "about 15 g, for the head, nose and ears"], ["White yarn", "a small amount, for the collar and socks"], ["Polymer clay", "a small amount, for the whites of the eyes"], ["Small black beads or safety eyes", "5 mm, for the pupils"], ["Copper wire", "single core, 1 mm, about 200 cm, for the frame"], ["Green felting wool", "for the hair, with a little brown"], ["Stuffing", "any kind"], ["Transparent glue and sewing thread", ""], ["Fake eyelashes", "optional"], ["Small bells, beads and baubles", "optional, for the hat"], ["Eyeshadow or oil pastel", "optional, to tint the cheeks"]], "tools": [["2 mm steel crochet hook", "US 4 / UK 2½"], ["Stitch marker", ""], ["Tapestry needle", ""], ["Felting needle", "optional, for the hair"]], "techniques": ["Crochet in rounds", "Single crochet", "Increases & decreases", "Wire frame", "Needle felting"], "finalTitle": mm", "US Stahl 4 / UK 14"], ["Stopfnadel", ""]], "techniques": ["Häkeln in Runden", "Feste Maschen", "Halbe Stäbchen", "Aufgehäkelte Kettmaschen", "Fransen"], "finalTitle": "Häkle eins für jede Leseratte, die du kennst", "insideCaptions": {"cover": "Titelblatt und Materialseite", "pages": "Alle 12 Seiten auf einen Blick"}}, "FR": {"title": "Marque-page petit cheval Ge-Ge", "sizeSub": "10 pouces de long", "eyebrow": "Marque-page · appliqué · facile", "lead": "Un marque-page petit cheval aux longues jambes et à la crinière en laine, de 24 cm de long. Un projet rapide et facile avec tes restes de laine, et un joli petit cadeau pour tous les amoureux de lecture.", "aboutTitle": "Vite fait, et un bonheur à offrir", "about": ["Ge-Ge est crochetée à plat en fil de coton, pour se glisser bien à plat entre les pages d’un livre. Sa crinière et sa queue sont faites de franges, et ses longues jambes dépassent du livre : tu retrouves toujours ta page.", "Elle demande environ 10 g de fil, parfait pour utiliser tes restes. Crochète-la dans les couleurs de ton choix : rose, orange, gris ou tout un troupeau arc-en-ciel. Des explications claires avec photos en font un très bon premier projet."], "yarn": ["Coton Sport / 5 fils", "environ 10 g plus des restes"], "materials": [["Fil de coton", "sport / 5 fils (environ 115 m pour 50 g), environ 10 g pour le corps"], ["Fil marron et blanc", "une petite quantité, pour la crinière, les sabots et les yeux"], ["Yeux pour jouets", "8–10 mm, ou yeux jumelés d’environ 18 mm"]], "tools": [["Crochet 2 mm", "US acier 4 / UK 14"], ["Aiguille à laine", ""]], "techniques": ["Crochet en rond", "Maille serrée", "Demi-bride", "Maille coulée en surface", "Franges"], "finalTitle": "Crochètes-en un pour chaque lecteur de ton entourage", "insideCaptions": {"cover": "La couverture et la page du matériel", "pages": "Les 12 pages en un coup d’œil"}}, "IT": {"title": "Segnalibro Cavallina Ge-Ge", "sizeSub": "10 pollici di lunghezza", "eyebrow": "Segnalibro · app pynt"]], "tools": [["Hæklenål i stål, 2 mm", "US 4 / UK 2½"], ["Maskemarkør", ""], ["Stoppenål", ""], ["Filtenål", "valgfrit, til håret"]], "techniques": ["Hækling i omgange", "Fastmasker", "Udtagninger og indtagninger", "Trådramme", "Nålefiltning"], "finalTitle": "Hækl en hel heksekreds til halloween", "insideCaptions": {"cover": "Forsiden og materialesiden", "pages": "Alle 22 sider på ét blik"}}, "DE": {"title": "Tania die kleine Hexe", "sizeSub": "5,1 Zoll hoch (sitzend)", "sameAsNote": "Dieselbe Anleitung wie „Puppe Tania die Tanne“, nur in anderen Farben gehäkelt. Es ist ein einziges PDF – du brauchst also nur eine der beiden zu kaufen.", "eyebrow": "Amigurumi-Puppe · Drahtgerüst", "lead": "Tania in ihren Halloween-Farben: ein spitzer Hexenhut, eine Kette aus winzigen Laternen und ein Grinsen, das nach Unfug aussieht. Sitzend 13 cm hoch, mit Drahtgerüst, damit sie posieren kann.", "aboutTitle": "Eine kleine Hexe für dein Halloween-Regal", "about": ["Das ist Tania, gehäkelt in Halloween-Farben: Orange, Lila, Grau oder in jedem Farbton, der dir gefällt. Sie wird aus feinem Garn (Fingering) über ein dünnes Kupferdrahtgerüst gehäkelt – so kann sie auf einem Kürbis sitzen und winken.", "Häkle eine einzelne oder gleich einen ganzen Hexenzirkel in verschiedenen Farben, wie auf den Fotos. Ihre Augen werden aus Modelliermasse geformt, das Haar aus Wolle gefilzt."], "yarn": ["Fingering / 4-fädig", "3 Farben, ca. 400 m / 100 g"], "materials": [["Garn in der Hauptfarbe", "ca. 25 g, für Körper, Hut, Arme und Beine (Orange, Lila, Grau …)"], ["Beiges oder rosa Garn", "ca. 15 g, für Kopf, Nase und Ohren"], ["Weißes Garn", "eine kleine Menge, für Kragen und Socken"], ["Modelliermasse", "eine kleine Menge, für das Weiße der Augen"], ["Kleine schwarze Perlen oder Sicherheitsaugen", "5 mm, für die Pupillen"], ["Kupferdraht", "einadrig, 1 mm, ca. 200 cm, für das Gerüst"], ["Filzwolle", "für das Haar"], ["Füllwatte", "beliebige Sorte"], ["Transparenter Kleber und Nähgarn", ""], ["Winzige Laternen, Perlen oder Glöckchen", "optional, zur Dekoration"]], "tools": [["Stahlhäkelnadel 2 mm", "US 4 / UK 2½"], ["Maschenmarkierer", ""], ["Stopfnadel", ""], ["Filznadel", "optional, für das Haar"]], "techniques": ["Häkeln in Runden", "Feste Maschen", "Zunahmen & Abnahmen", "Drahtgerüst", "Nadelfilzen"], "finalTitle": "Häkle einen ganzen Hexenzirkel für Halloween", "insideCaptions": {"cover": "Titelblatt und Materialseite", "pages": "Alle 22 Seiten auf einen Blick"}}, "FR": {"title": "Marie, la petite poupée sorcière", "sizeSub": "5,1 pouces de haut (assise)", "sameAsNote": "Même patron que « Marie, la poupée sapin de Noël », crocheté dans d’autres couleurs. C’est un seul et même PDF : tu n’as besoin d’en acheter qu’un des deux.", "eyebrow": "Poupée amigurumi · armature en fil de fer", "lead": "Marie aux couleurs d’Halloween : un chapeau pointu de sorcière, une guirlande de mini lanternes et un sourire qui annonce des bêtises. 13 cm de haut en position assise, avec une armature en fil de fer pour la faire poser.", "aboutTitle": "Une petite sorcière pour ton étagère d’Halloween", "about": ["Voici Marie crochetée aux couleurs d’Halloween : orange, violet, gris ou les teintes de ton choix. Elle est crochetée en fil fingering autour d’une fine armature en fil de cuivre, pour pouvoir s’asseoir sur une citrouille et faire coucou.", "Crochètes-en une, ou tout un cercle de sorcières de différentes couleurs, comme sur les photos. Ses yeux sont modelés en pâte polymère et ses cheveux feutrés en laine."], "yarn": ["Fingering / 4 fils", "3 couleurs, environ 400 m / 100 g"], "materials": [["Fil de couleur principale", "environ 25 g, pour le corps, le chapeau, les bras et les jambes (orange, violet, gris…)"], ["Fil beige ou rose", "environ 15 g, pour la tête, le nez et les oreilles"], ["Fil blanc", "une petite quantité, pour le col et les chaussettes"], ["Pâte polymère", "une petite quantité, pour le blanc des yeux"], ["Petites perles noires ou yeux de sécurité", "5 mm, pour les pupilles"], ["Fil de cuivre", "monobrin, 1 mm, environ 200 cm, pour l’armature"], ["Laine à feutrer", "pour les cheveux"], ["Rembourrage", "de n’importe quel type"], ["Colle transparente et fil à coudre", ""], ["Mini lanternes, perles ou clochettes", "en option, pour la décoration"]], "tools": [["Crochet acier 2 mm", "US 4 / UK 2½"], ["Marqueur de mailles", ""], ["Aiguille à laine", ""], ["Aiguille à feutrer", "en option, pour les cheveux"]], "techniques": ["Crochet en rond", "Maille serrée", "Augmentations et diminutions", "Armature en fil de fer", "Feutrage à l’aiguille"], "finalTitle": "Crochète tout un cercle de sorcières pour Halloween", "insideCaptions": {"cover": "La couverture et la page du matériel", "pages": "Les 22 pages en un coup d’œil"}}, "IT": {"title": "Bambolina Streghetta", "sizeSub": "5,1 pollici di altezza (da seduta)", "sameAsNote": "Stesso schema della “Bambolina Natalina”, lavorato in colori diversi. È un unico PDF, quindi ti basta acquistarne uno.", "eyebrow": "Bambolina amigurumi · armatura di filo metallico", "lead": "La nostra bambolina nei colori di Halloween: un cappello da strega a punta, una ghirlanda di mini lanterne e un sorrisetto che promette guai. Alta 13 cm da seduta, con un'armatura di filo metallico per metterla in posa.", "aboutTitle": "Una piccola strega per la tua mensola di Halloween", "about": ["È la Bambolina Natalina lavorata nei colori di Halloween: arancione, viola, grigio o le tonalità che preferisci. Si lavora con un filato sottile (4 ply) sopra un'armatura di sottile filo di rame, così può sedersi su una zucca e salutare.", "Creane una sola o un'intera congrega in colori diversi, come nelle foto. Gli occhi sono modellati in pasta polimerica e i capelli sono infeltriti con la lana."], "yarn": ["Fingering / 4 ply", "3 colori, circa 400 m / 100 g"], "materials": [["Filato del colore principale", "circa 25 g, per corpo, cappello, braccia e gambe (arancione, viola, grigio…)"], ["Filato beige o rosa", "circa 15 g, per testa, naso e orecchie"], ["Filato bianco", "un po', per colletto e calzini"], ["Pasta polimerica", "un po', per il bianco degli occhi"], ["Perline nere o occhi di sicurezza", "5 mm, per le pupille"], ["Filo di rame", "unipolare, 1 mm, circa 200 cm, per l'armatura"], ["Lana da infeltrire", "per i capelli"], ["Imbottitura", "di qualsiasi tipo"], ["Colla trasparente e filo da cucito", ""], ["Mini lanterne, perline o campanellini", "facoltativi, per decorare"]], "tools": [["Uncinetto d'acciaio da 2 mm", "US 4 / UK 2½"], ["Segnapunti", ""], ["Ago da lana", ""], ["Ago per infeltrire", "facoltativo, per i capelli"]], "techniques": ["Lavorazione in giri", "Maglia bassa", "Aumenti e diminuzioni", "Armatura di filo metallico", "Infeltrimento ad ago"], "finalTitle": "Crea un'intera congrega per Halloween", "insideCaptions": {"cover": "La copertina e la pagina dei materiali", "pages": "Tutte le 22 pagine in un colpo d'occhio"}}, "NL": {"title": "Pop Marie het Heksje", "sizeSub": "13 cm hoog (zittend)", "sameAsNote": "Hetzelfde patroon als “Pop Marie de Kerstboom”, gehaakt in andere kleuren. Het is één PDF, dus je hoeft er maar één van te kopen.", "eyebrow": "Amigurumi pop · draadframe", "lead": "Marie in haar halloweenkleuren: een puntige heksenhoed, een slinger mini-lampionnetjes en een grijns die niet veel goeds belooft. Zittend 13 cm hoog, met een frame van draad zodat ze kan poseren.", "aboutTitle": "Een klein heksje voor je halloweenplankje", "about": ["Dit is Marie, gehaakt in halloweenkleuren: oranje, paars, grijs of welke tinten je maar mooi vindt. Je haakt haar van dun garen (fingering) over een frame van dun koperdraad, zodat ze op een pompoen kan zitten en zwaaien.", "Haak er één, of een hele heksenkring in verschillende kleuren, zoals op de foto's. Haar oogjes maak je van polymeerklei en haar haar vilt je van wol."], "yarn": ["Fingering / 4 ply", "3 kleuren, ca. 400 m / 100 g"], "materials": [["Garen in de hoofdkleur", "ca. 25 g, voor lijf, hoed, armen en benen (oranje, paars, grijs…)"], ["Beige of roze garen", "ca. 15 g, voor hoofd, neus en oren"], ["Wit garen", "een klein beetje, voor kraagje en sokjes"], ["Polymeerklei", "een klein beetje, voor het wit van de ogen"], ["Kleine zwarte kraaltjes of veiligheidsoogjes", "5 mm, voor de pupillen"], ["Koperdraad", "massief, 1 mm, ca. 200 cm, voor het frame"], ["Viltwol", "voor het haar"], ["Vulling", "elke soort"], ["Transparante lijm en naaigaren", ""], ["Mini-lampionnetjes, kraaltjes of belletjes", "optioneel, als versiering"]], "tools": [["Stalen haaknaald 2 mm", "US 4 / UK 2½"], ["Steekmarkeerder", ""], ["Stopnaald", ""], ["Viltnaald", "optioneel, voor het haar"]], "techniques": ["Haken in toeren", "Vasten", "Meerderen & minderen", "Frame van draad", "Naaldvilten"], "finalTitle": "Haak een hele heksenkring voor Halloween", "insideCaptions": {"cover": "De voorpagina en de materialenpagina", "pages": "Alle 22 pagina's in één oogopslag"}}, "PL": {"title": "Lalka Marie – mała czarownica", "sizeSub": "5,1 cala wysokości (na siedząco)", "sameAsNote": "To ten sam wzór co „Lalka Marie – choinka”, tylko wydziergany w innych kolorach. To jeden PDF, więc wystarczy kupić jeden z nich.", "eyebrow": "Lalka amigurumi · stelaż z drutu", "lead": "Marie w halloweenowych kolorach: spiczasty kapelusz czarownicy, girlanda malutkich lampionów i uśmiech, który zwiastuje psoty. 13 cm wysokości na siedząco, ze stelażem z drutu, dzięki któremu może pozować.", "aboutTitle": "Mała czarownica na twoją halloweenową półkę", "about": ["To Marie wydziergana w kolorach Halloween: pomarańczowym, fioletowym, szarym albo w dowolnych odcieniach, które lubisz. Dziergasz ją z cienkiej włóczki (fingering) na stelażu z cienkiego miedzianego drutu, więc może usiąść na dyni i machać.", "Zrób jedną albo cały sabat czarownic w różnych kolorach, jak na zdjęciach. Oczy są wymodelowane z masy polimerowej, a włosy wyfilcowane z wełny."], "yarn": ["Fingering / 4 ply", "3 kolory, ok. 400 m / 100 g"], "materials": [["Włóczka w kolorze głównym", "ok. 25 g, na tułów, kapelusz, rączki i nóżki (pomarańczowa, fioletowa, szara…)"], ["Beżowa lub różowa włóczka", "ok. 15 g, na głowę, nos i uszy"], ["Biała włóczka", "niewielka ilość, na kołnierzyk i skarpetki"], ["Masa polimerowa", "niewielka ilość, na białka oczu"], ["Małe czarne koraliki lub oczka z zabezpieczeniem", "5 mm, na źrenice"], ["Miedziany drut", "jednożyłowy, 1 mm, ok. 200 cm, na stelaż"], ["Wełna do filcowania", "na włosy"], ["Wypełnienie", "dowolne"], ["Przezroczysty klej i nici do szycia", ""], ["Malutkie lampiony, koraliki lub dzwoneczki", "opcjonalnie, do dekoracji"]], "tools": [["Stalowe szydełko 2 mm", "US 4 / UK 2½"], ["Znacznik oczek", ""], ["Igła z tępym końcem", ""], ["Igła do filcowania", "opcjonalnie, do włosów"]], "techniques": ["Dzierganie w okrążeniach", "Półsłupki", "Dodawanie i ujmowanie oczek", "Stelaż z drutu", "Filcowanie na sucho"], "finalTitle": "Wydziergaj cały sabat na Halloween", "insideCaptions": {"cover": "Okładka i strona z materiałami", "pages": "Wszystkie 22 strony w skrócie"}}}, "eyebrow": "Amigurumi doll · wire frame", "lead": "Marie in her Halloween colours: a pointed witch's hat, a string of tiny lanterns and a grin that means trouble. 13 cm tall when seated, with a wire frame so she can pose.", "aboutTitle": "A little witch for your Halloween shelf", "about": ["This is Marie crocheted in Halloween colours: orange, purple, grey or any shades you like. She's crocheted in fingering-weight yarn over a thin copper-wire frame, so she can sit on a pumpkin and wave.", "Make one, or a whole coven in different colours, as in the photos. Her eyes are shaped from polymer clay and her hair is felted from wool."], "yarn": ["Fingering / 4 ply", "3 colours, about 400 m / 100 g"], "materials": [["Main colour yarn", "about 25 g, for the body, hat, arms and legs (orange, purple, grey…)"], ["Beige or pink yarn", "about 15 g, for the head, nose and ears"], ["White yarn", "a small amount, for the collar and socks"], ["Polymer clay", "a small amount, for the whites of the eyes"], ["Small black beads or safety eyes", "5 mm, for the pupils"], ["Copper wire", "single core, 1 mm, about 200 cm, for the frame"], ["Felting wool", "for the hair"], ["Stuffing", "any kind"], ["Transparent glue and sewing thread", ""], ["Tiny lanterns, beads or bells", "optional, for decoration"]], "tools": [["2 mm steel crochet hook", "US 4 / UK 2½"], ["Stitch marker", ""], ["Tapestry needle", ""], ["Felting needle", "optional, for the hair"]], "techniques": ["Crochet in rounds", "Single crochet", "Increases & decreases", "Wire frame", "Needle felting"], "finalTitle": "Make a whole coven for Halloween", "clip": "https://video.wixstatic.com/video/752f67_d6863261450d4c3b94523c2c0927ae12/480p/mp4/file.mp4", "clipPoster": "https://static.wixstatic.com/media/752f67_d6863261450d4c3b94523c2c0927ae12f002.jpg", "tutorial": false, "pair": null}], "designers": {"Knittoy": {"name": "Tatiana Knittoy", "initials": "TK", "bio": "Tatiana designs small, quick amigurumi with lots of charm: flat-backed toys you can finish as keyrings, brooches or magnets. Her patterns are easy to follow and perfect for using up yarn scraps.", "tr": {"DA": {"bio": "Tatiana designer små, hurtige amigurumi med masser af charme: figurer med flad ryg, som du kan gøre færdige som nøgleringe, brocher eller magneter. Hendes mønstre er nemme at følge og perfekte til at bruge garnrester."}, "DE": {"bio": "Tatiana entwirft kleine, schnell gehäkelte Amigurumi mit viel Charme: Figuren mit flacher Rückseite, die du als Schlüsselanhänger, Brosche oder Magnet fertigstellen kannst. Ihre Anleitungen sind leicht nachzuarbeiten und ideal, um Garnreste aufzubrauchen."}, "FR": {"bio": "Tatiana crée de petits amigurumis rapides à réaliser et pleins de charme : des modèles au dos plat que tu peux transformer en porte-clés, en broche ou en magnet. Ses patrons sont faciles à suivre et parfaits pour utiliser tes restes de laine."}, "IT": {"bio": "Tatiana crea piccoli amigurumi veloci e pieni di fascino: pupazzetti dal retro piatto che puoi trasformare in portachiavi, spille o calamite. I suoi schemi sono facili da seguire e perfetti per usare gli avanzi di filato."}, "NL": {"bio": "Tatiana ontwerpt kleine, snelle amigurumi vol charme: knuffeltjes met een platte achterkant die je kunt afwerken als sleutelhanger, broche of magneet. Haar patronen zijn makkelijk te volgen en perfect om restjes garen op te maken."}, "PL": {"bio": "Tatiana projektuje małe, szybkie amigurumi pełne uroku: zabawki z płaskimi plecami, które możesz wykończyć jako breloki, broszki lub magnesy. Jej wzory są łatwe do wykonania i idealne na resztki włóczki."}}}, "Astashova": {"name": "Galina Astashova", "initials": "GA", "bio": "Galina designs character dolls in fine yarn on small hooks, with sculpted faces, poseable wire frames and clothes you sew yourself. Every step is shown in photos, not just described.", "tr": {"DA": {"bio": "Galina designer karakterdukker i tyndt garn på små hæklenåle, med skulpturerede ansigter, bøjelige trådrammer og tøj, som du selv syr. Hvert trin er vist med fotos – ikke kun beskrevet."}, "DE": {"bio": "Galina entwirft Charakterpuppen aus feinem Garn mit kleinen Häkelnadeln – mit plastisch modellierten Gesichtern, beweglichen Drahtgerüsten und Kleidung zum Selbernähen. Jeder Schritt wird mit Fotos gezeigt, nicht nur beschrieben."}, "FR": {"bio": "Galina crée des poupées de caractère au fil fin et au petit crochet, avec des visages modelés, une armature en fil de fer pour les faire poser et des vêtements que tu couds toi-même. Chaque étape est montrée en photos, pas seulement décrite."}, "IT": {"bio": "Galina crea bambole di carattere con filati sottili e uncinetti piccoli, con visi modellati, armature di filo metallico snodabili e vestiti da cucire tu stessa. Ogni passaggio è mostrato in foto, non solo descritto."}, "NL": {"bio": "Galina ontwerpt karakterpoppen van dun garen op kleine haaknaalden, met geboetseerde gezichtjes, beweegbare draadframes en kleertjes die je zelf naait. Elke stap wordt met foto's getoond, niet alleen beschreven."}, "PL": {"bio": "Galina projektuje lalki z charakterem z cienkiej włóczki na małym szydełku – z wymodelowanymi twarzami, stelażami z drutu do pozowania i ubrankami do samodzielnego uszycia. Każdy etap jest pokazany na zdjęciach, a nie tylko opisany."}}}, "Pertseva": {"name": "Svetlana Pertseva", "initials": "SP", "bio": "Svetlana's dolls are small, cheeky and full of character: big eyes, felted hair and wire frames so they can sit, wave and hold things. Her patterns suit crocheters ready to go beyond basic amigurumi.", "tr": {"DA": {"bio": "Svetlanas dukker er små, frække og fulde af personlighed: store øjne, filtet hår og trådrammer, så de kan sidde, vinke og holde ting. Hendes mønstre passer til dig, der er klar til at gå videre end almindelig amigurumi."}, "DE": {"bio": "Svetlanas Puppen sind klein, frech und voller Charakter: große Augen, gefilztes Haar und Drahtgerüste, damit sie sitzen, winken und Dinge halten können. Ihre Anleitungen sind ideal für alle, die über einfache Amigurumi hinausgehen möchten."}, "FR": {"bio": "Les poupées de Svetlana sont petites, espiègles et pleines de caractère : de grands yeux, des cheveux feutrés et une armature en fil de fer pour qu’elles puissent s’asseoir, faire coucou et tenir des objets. Ses patrons conviennent aux crocheteuses prêtes à aller au-delà des amigurumis de base."}, "IT": {"bio": "Le bamboline di Svetlana sono piccole, sfacciate e piene di personalità: occhi grandi, capelli infeltriti e armature di filo metallico per farle sedere, salutare e tenere oggetti in mano. I suoi schemi sono adatti a chi è pronta ad andare oltre gli amigurumi di base."}, "NL": {"bio": "De poppen van Svetlana zijn klein, ondeugend en vol karakter: grote ogen, gevilt haar en draadframes, zodat ze kunnen zitten, zwaaien en dingen vasthouden. Haar patronen zijn ideaal voor haaksters die verder willen dan de basis-amigurumi."}, "PL": {"bio": "Lalki Swietłany są małe, zadziorne i pełne charakteru: duże oczy, filcowane włosy i stelaże z drutu, dzięki którym mogą siedzieć, machać i trzymać różne rzeczy. Jej wzory są dla osób, które chcą wyjść poza podstawowe amigurumi."}}}, "Zabelina": {"name": "Svetlana Zabelina", "initials": "SZ", "bio": "Svetlana designs flat crochet appliqués and bookmarks: quick, cheerful projects that use up scraps of yarn and make lovely small gifts.", "tr": {"DA": {"bio": "Svetlana designer flade hæklede applikationer og bogmærker: hurtige, glade projekter, der bruger garnrester og bliver til dejlige små gaver."}, "DE": {"bio": "Svetlana entwirft flache Häkelapplikationen und Lesezeichen: schnelle, fröhliche Projekte, mit denen du Garnreste aufbrauchst und die wunderbare kleine Geschenke sind."}, "FR": {"bio": "Svetlana crée des appliqués et des marque-pages au crochet à plat : des projets rapides et joyeux qui utilisent tes restes de laine et font de jolis petits cadeaux."}, "IT": {"bio": "Svetlana crea applicazioni e segnalibri piatti all'uncinetto: progetti veloci e allegri che usano gli avanzi di filato e diventano deliziosi piccoli regali."}, "NL": {"bio": "Svetlana ontwerpt platte gehaakte applicaties en boekenleggers: snelle, vrolijke projectjes waarmee je restjes garen opmaakt en die leuke kleine cadeautjes zijn."}, "PL": {"bio": "Swietłana projektuje płaskie szydełkowe aplikacje i zakładki: szybkie, radosne projekty, które pozwalają zużyć resztki włóczki i są uroczymi drobnymi prezentami."}}}}};

function params(){ const q = location.hash.split("?")[1]||""; return Object.fromEntries(new URLSearchParams(q)); }
function setParams(p){ const q = new URLSearchParams(Object.entries(p).filter(([,v])=>v)).toString(); location.hash = "#/" + (q?"?"+q:""); }
function matches(pg, f, anyLang){
  if(f.q && !(pg.title+" "+loc(pg).title+" "+pg.designerName+" "+pg.categories.join(" ")).toLowerCase().includes(f.q.toLowerCase())) return false;
  if(f.skill && pg.skill!==f.skill) return false;
  if(f.designer && pg.designerKey!==f.designer) return false;
  if(!anyLang && PREFS.plangs.length && !pg.languages.some(l=>PREFS.plangs.includes(l.code))) return false;
  if(f.cat && !pg.categories.includes(f.cat)) return false;
  if(f.hook){ const h = HOOKS.find(x=>x[0]===f.hook); if(!pg.hookMm.some(h[2])) return false; }
  return true;
}

const WIX = { clientId: "cc40edea-1299-4afb-b87f-dd336a1dca83", storesAppId: "215238eb-22a5-4c36-9e7b-e7c08025e04e" };
const BT = new Proxy({}, { get: (_, k) => k==="empty" ? t("empty_basket") : t("b_"+k) });
function basketGet(){ try{ return JSON.parse(store.get("hubBasket")) || [] }catch(e){ return [] } }
function basketSet(b){ store.set("hubBasket", JSON.stringify(b)); basketRender(); }
function basketAdd(item){
  const b = basketGet();
  if(b.some(x=>x.pid===item.pid)){ toast(BT.dup); return; }
  b.push(item); basketSet(b);
}
function basketRender(){
  const b = basketGet(), c = $("#count"); if(c) c.textContent = b.length;
  const box = $("#bItems"); if(!box) return;
  $("#bTitle").textContent = BT.title;
  box.innerHTML = b.length ? b.map((x,i)=>`<div style="display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center">
      <img src="${x.img}" alt="" style="width:56px;height:45px;object-fit:cover;border-radius:6px">
      <div><b>${esc(x.title)}</b><br><small>${FLAGS[x.lang]||""} PDF: ${esc(langName(x.lang))} · ${fmt(x.price)}</small></div>
      <button type="button" class="clear" data-i="${i}">${BT.remove}</button></div>`).join("") : `<p>${BT.empty}</p>`;
  box.querySelectorAll("button[data-i]").forEach(btn=>btn.onclick=()=>{ const nb=basketGet(); nb.splice(+btn.dataset.i,1); basketSet(nb); });
  const sum = b.reduce((s,x)=>s+(+x.price),0);
  $("#bTotal").innerHTML = b.length ? `<span>${BT.total}</span><span>${PREFS.cur==="GBP"?"":"≈ "}${fmt(sum)}</span>` : "";
  $("#bNote").textContent = b.length ? BT.note + (BT.lang ? " " + BT.lang : "") : "";
  const go = $("#bGo"); go.textContent = BT.go; go.disabled = !b.length; go.style.opacity = b.length ? 1 : .5;
}
function openBasket(){ basketRender(); $("#basketDlg").showModal(); }
async function wixFetch(path, body, tok){
  const r = await fetch("https://www.wixapis.com/" + path, { method:"POST",
    headers: Object.assign({"Content-Type":"application/json"}, tok ? {Authorization: tok} : {}), body: JSON.stringify(body) });
  if(!r.ok) throw new Error(path + " " + r.status);
  return r.json();
}
async function wixToken(){
  try{ const s = JSON.parse(store.get("wixTok")); if(s && s.exp > Date.now() + 60e3) return s.tok; }catch(e){}
  const r = await wixFetch("oauth2/token", { clientId: WIX.clientId, grantType: "anonymous" });
  store.set("wixTok", JSON.stringify({ tok: r.access_token, exp: Date.now() + r.expires_in * 1000 }));
  return r.access_token;
}
// Wix checkout shows (and charges in) the visitor's currency when the checkout page gets ?currency=XXX,
// the same switch littleowlshut.com uses. The redirect URL wraps the checkout address in its redirectUrl parameter.
function withCurrency(full){
  if(!PREFS.cur || PREFS.cur==="GBP") return full;
  try{ const u = new URL(full), inner = u.searchParams.get("redirectUrl");
    if(inner){ const c = new URL(inner); c.searchParams.set("currency", PREFS.cur); u.searchParams.set("redirectUrl", c.toString()); }
    else u.searchParams.set("currency", PREFS.cur);
    return u.toString(); }catch(e){ return full; }
}
async function checkout(){
  const b = basketGet(); if(!b.length) return;
  const go = $("#bGo"); go.disabled = true; go.textContent = BT.wait;
  try{
    const tok = await wixToken();
    // Wix Cart V2 (the current eCommerce API; the old Checkout API is retired on 1 Feb 2027). The cart id is the checkout id.
    const cart = (await wixFetch("ecom/v2/carts", {
      catalogItems: b.map(x=>({ quantity: 1, catalogReference: { appId: WIX.storesAppId, catalogItemId: x.pid } })) }, tok)).cart;
    const back = new URL("thanks.html", document.baseURI).href;
    const rs = await wixFetch("redirect-session/v1/redirect-session", { ecomCheckout: { checkoutId: cart.id },
      callbacks: { postFlowUrl: location.href, thankYouPageUrl: back } }, tok);
    location.href = withCurrency(rs.redirectSession.fullUrl);
  }catch(e){
    console.error(e); store.set("wixTok", ""); go.disabled = false; go.textContent = BT.go; toast(BT.err);
  }
}
document.addEventListener("click", e => { if(e.target && e.target.id === "bGo") checkout(); if(e.target && e.target.id === "bClose") $("#basketDlg").close(); });

}
$("#sApply").onclick = () => {
  const ui = document.querySelector('#setForm input[name="ui"]:checked')?.value || "EN";
  if(ui==="AUTO" && !$("#autoLang").value){ $("#autoLang").focus(); return; }
  PREFS = { ui, auto: ui==="AUTO" ? $("#autoLang").value : "", cur: $("#sCur").value,
            plangs: [...$("#sPl").querySelectorAll("input:checked")].map(i=>i.value) };
  savePrefs(); $("#settings").close(); applyChrome(); route();
};
$("#setBtn").onclick = openSettings;
applyChrome();
$("#basketBtn").onclick = openBasket; basketRender();
let tt; function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),2600); }
window.addEventListener("hashchange", route);
route();
// use Wix's own exchange rates, so the price shown here matches the Wix checkout
(async () => { try{
  const tok = await wixToken();
  const got = await Promise.all(Object.keys(RATES).filter(c=>c!=="GBP").map(async c => {
    const r = await fetch(`https://www.wixapis.com/currency_converter/v1/currencies/rate/GBP/convert/${c}`, {headers:{Authorization:tok}});
    const j = await r.json(); return [c, Number(j.rate.value) / 10**j.rate.decimalPlaces]; }));
  got.forEach(([c,v]) => { if(v > 0) RATES[c][0] = v; });
  if(PREFS.cur !== "GBP"){ route(); basketRender(); }
}catch(e){} })();
// use the current Wix prices (a price changed in the Wix dashboard shows here straight away, no rebuild needed)
(async () => { try{
  const tok = await wixToken();
  const ids = [...new Set(DATA.pages.flatMap(p => p.languages.map(l => l.pid)).filter(Boolean))];
  const r = await fetch("https://www.wixapis.com/stores/v3/products/search", {method:"POST", headers:{"Content-Type":"application/json", Authorization:tok},
    body: JSON.stringify({search:{filter:{id:{$in:ids}}, cursorPaging:{limit:100}}})});
  const live = Object.fromEntries(((await r.json()).products||[]).map(x => [x.id, Number(x.actualPriceRange?.minValue?.amount)]));
  let changed = false;
  DATA.pages.forEach(p => { p.languages.forEach(l => { const v = live[l.pid]; if(v > 0 && v !== l.price){ l.price = v; changed = true; } });
    const en = p.languages.find(l => l.code === "EN"); if(en && en.price !== p.price){ p.price = en.price; changed = true; } });
  const b = basketGet(); let bc = false; b.forEach(x => { const v = live[x.pid]; if(v > 0 && v !== x.price){ x.price = v; bc = true; } });
  if(bc) basketSet(b);
  if(changed) route();
}catch(e){} })();
</script>
</body></html>
