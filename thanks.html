<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thank you · LittleOwlsHut Patterns</title>
<meta name="robots" content="noindex">
<style>
  :root{--ink:#2b2420;--ground:#fbf7f1;--accent:#c8643b}
  body{margin:0;background:var(--ground);color:var(--ink);font:17px/1.6 Georgia,serif;display:grid;place-items:center;min-height:100vh;padding:16px;box-sizing:border-box}
  main{max-width:560px;text-align:center}
  h1{font-size:2rem;margin:.2em 0}
  a.cta.dl{background:var(--accent);margin:.2em 0 .6em;font-size:1.05rem}
  a.cta[hidden]{display:none}
  a.cta{display:inline-block;margin-top:1.2em;background:var(--ink);color:var(--ground);padding:.8em 1.4em;border-radius:999px;text-decoration:none;font-family:system-ui,sans-serif;font-weight:700}
</style>
</head>
<body>
<main>
  <p>🦉</p>
  <h1 id="ty_title">Thank you for your order!</h1>
  <p id="ty_p">Your pattern download link is on its way by email.
     If it hasn't arrived within a few minutes, please check your spam folder, or email
     <a href="mailto:info@littleowlshut.com">info@littleowlshut.com</a>.</p>
  <a class="cta dl" id="ty_dl" hidden></a>
  <p><span id="ty_sign">Happy crocheting!</span><br>Kate, LittleOwlsHut</p>
  <a class="cta" href="./" id="ty_back">Back to the patterns</a>
</main>
<script>
try{localStorage.removeItem("hubBasket")}catch(e){}
try{ const TY={"EN": {"ty_title": "Thank you for your order!", "ty_p": "Your pattern download link is on its way by email. If it hasn't arrived within a few minutes, please check your spam folder, or email info@littleowlshut.com.", "ty_sign": "Happy crocheting!", "ty_back": "Back to the patterns"}, "DA": {"ty_title": "Tak for din bestilling!", "ty_p": "Dit downloadlink til mønsteret er på vej på e-mail. Hvis det ikke er kommet inden for et par minutter, så tjek din spam-mappe, eller skriv til info@littleowlshut.com.", "ty_sign": "God fornøjelse med hæklingen!", "ty_back": "Tilbage til mønstrene"}, "DE": {"ty_title": "Vielen Dank für deine Bestellung!", "ty_p": "Der Download-Link für deine Anleitung ist per E-Mail unterwegs. Falls nach ein paar Minuten nichts angekommen ist, schau bitte in deinem Spam-Ordner nach oder schreib an info@littleowlshut.com.", "ty_sign": "Viel Freude beim Häkeln!", "ty_back": "Zurück zu den Anleitungen"}, "FR": {"ty_title": "Merci pour ta commande !", "ty_p": "Le lien de téléchargement de ton patron arrive par e-mail. S’il n’est pas arrivé d’ici quelques minutes, vérifie ton dossier spam, ou écris à info@littleowlshut.com.", "ty_sign": "Bon crochet !", "ty_back": "Retour aux patrons"}, "IT": {"ty_title": "Grazie per il tuo ordine!", "ty_p": "Il link per scaricare lo schema ti arriverà via email. Se non arriva entro qualche minuto, controlla la cartella spam oppure scrivi a info@littleowlshut.com.", "ty_sign": "Buon uncinetto!", "ty_back": "Torna agli schemi"}, "NL": {"ty_title": "Bedankt voor je bestelling!", "ty_p": "De downloadlink van je patroon komt eraan per e-mail. Nog niets ontvangen na een paar minuten? Kijk dan even in je spammap, of mail naar info@littleowlshut.com.", "ty_sign": "Veel haakplezier!", "ty_back": "Terug naar de patronen"}, "PL": {"ty_title": "Dziękujemy za zamówienie!", "ty_p": "Link do pobrania wzoru jest już w drodze na twój e-mail. Jeśli nie dotrze w ciągu kilku minut, sprawdź folder ze spamem albo napisz na info@littleowlshut.com.", "ty_sign": "Miłego dziergania!", "ty_back": "Wróć do wzorów"}}, ui=(JSON.parse(localStorage.getItem("hubPrefs"))||{}).ui, d=TY[ui];
  if(d){ document.documentElement.lang=ui.toLowerCase(); for(const [k,v] of Object.entries(d)){ const el=document.getElementById(k); if(el) el.textContent=v; } } }catch(e){}
// Download button: the shop's own order page, which lists the PDF download links for this order (same browser, right after paying)
try{ const id=new URLSearchParams(location.search).get("orderId"), ui=((JSON.parse(localStorage.getItem("hubPrefs"))||{}).ui||"EN");
  const DL={EN:"Download your patterns",DE:"Anleitungen herunterladen",NL:"Download je patronen",DA:"Download dine opskrifter",IT:"Scarica i tuoi schemi",PL:"Pobierz swoje wzory",FR:"Télécharger tes patrons"};
  if(/^[0-9a-f-]{36}$/.test(id||"")){ const a=document.getElementById("ty_dl");
    a.href="https://www.littleowlshut.com/"+(ui!=="EN"&&DL[ui]?ui.toLowerCase()+"/":"")+"thank-you-page/"+id; a.textContent="⬇ "+(DL[ui]||DL.EN); a.hidden=false; } }catch(e){}
</script>
</body>
</html>
